classes:
  wet: 0
  dry: 1
  reject: 2
  empty: 3
enable_reject_class: true
enable_empty_class: true

dataset:
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  min_crop_width: 24
  min_crop_height: 24
  min_crop_area: 900
  padding_fraction: 0.10
  near_duplicate_hash_distance: 4

camera:
  index: 0
  width: 640
  height: 480
  roi: [0, 0, 640, 480]
  mjpeg: false

model:
  path: models/model_float32.tflite
  image_size: 224
  confidence_threshold: 0.80
  normalization: zero_one

prediction:
  window_size: 7
  minimum_votes: 5
  empty_frames_required: 8
  cooldown_seconds: 1.0

servo:
  gpio_bcm: 18
  neutral_angle: 90
  wet_angle: 25
  dry_angle: 155
  movement_time_seconds: 0.8
  hold_time_seconds: 1.0

system:
  simulation_mode: true
  inference_only: false
  show_preview: true
  log_predictions: true
